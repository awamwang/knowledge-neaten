# knowledge-neaten · 归类候选体系（taxonomy.example.yaml）
#
# E 类「归类建议」用：AI 只在这些候选里给建议，不凭空造类；不改名不移动。
# 复制为 config/taxonomy.yaml（不进 Git）。这是第二期 assess.py 的输入，scan.py 不读它。

version: 1

# 主类目（每篇建议 1 个主类）
categories:
  - 工作/项目
  - 工作/会议
  - 学习/技术
  - 学习/语言
  - 生活/健康
  - 生活/财务
  - 归档/已完成
  - 归档/可清理     # 疑似过期/失效落这里（仍只建议，不删）

# 可选标签（每篇最多 max_tags 个）
tags:
  - todo
  - reference
  - daily
  - meeting
  - needs-review

max_tags: 4
